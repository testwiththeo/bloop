[package]
name = "bloop"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
ashpd = { version = "0.14.3", default-features = false, features = [
    "screencast",
    "async-io",
] }
cairo-rs = "0.22"
gifski = "1.34.0"
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gtk4 = "0.11"
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
