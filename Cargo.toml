[package]
name = "bloop"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
ashpd = { version = "0.14.3", default-features = false, features = [
    "screencast",
    "async-io",
] }
cairo-rs = "0.22"
gifski = "1.34.0"
gtk4 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
